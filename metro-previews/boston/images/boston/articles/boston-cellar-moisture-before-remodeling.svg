<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Before finishing a Boston cellar, identify the water pathway</title><desc id="desc">Decision map: Humid summer air; Bulkhead runoff; Low plumbing fixture; Utilities above exposure. Original conceptual cellar section separating condensation, bulkhead runoff, plumbing backup, and protected utility placement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#78313f"/></marker></defs><rect width="960" height="640" fill="#fbf7ed"/><path d="M48 62H912" stroke="#78313f" stroke-width="3"/><text x="48" y="103" fill="#78313f" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="48" dy="0">BOSTON</tspan></text><text x="48" y="157" fill="#392d30" font-family="Arial,sans-serif" font-size="34" font-weight="600" text-anchor="start"><tspan x="48" dy="0">Before finishing a Boston cellar, identify the</tspan><tspan x="48" dy="41.48">water pathway</tspan></text><path d="M140 237H595V435H140Z M140 237L595 435 M595 237L140 435" stroke="#78313f" stroke-width="3" opacity=".42" fill="none"/><circle cx="116" cy="238" r="20" fill="#fbf7ed" stroke="#78313f" stroke-width="5"/><circle cx="571" cy="238" r="20" fill="#fbf7ed" stroke="#78313f" stroke-width="5"/><circle cx="116" cy="438" r="20" fill="#fbf7ed" stroke="#78313f" stroke-width="5"/><circle cx="571" cy="438" r="20" fill="#fbf7ed" stroke="#78313f" stroke-width="5"/><text x="90" y="280" fill="#392d30" font-family="Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="90" dy="0">Humid summer air</tspan></text><text x="545" y="280" fill="#392d30" font-family="Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="545" dy="0">Bulkhead runoff</tspan></text><text x="90" y="480" fill="#392d30" font-family="Arial,sans-serif" f