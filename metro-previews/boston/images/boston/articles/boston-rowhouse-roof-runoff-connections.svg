<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Follow a rowhouse roof drain all the way to its destination</title><desc id="desc">Decision map: Roof drain; Leader and cleanout; Rear-court low point; Verified public connection. Original conceptual rowhouse drainage section tracing a roof leader through a tight rear court to its verified public connection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#78313f"/></marker></defs><rect width="960" height="640" fill="#fbf7ed"/><path d="M48 62H912" stroke="#78313f" stroke-width="3"/><text x="48" y="103" fill="#78313f" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="48" dy="0">BOSTON</tspan></text><text x="48" y="157" fill="#392d30" font-family="Arial,sans-serif" font-size="34" font-weight="600" text-anchor="start"><tspan x="48" dy="0">Follow a rowhouse roof drain all the way to its</tspan><tspan x="48" dy="41.48">destination</tspan></text><path d="M138 245 L557 245" fill="none" stroke="#78313f" stroke-width="4" marker-end="url(#arrow)"/><path d="M593 245 L557 445" fill="none" stroke="#78313f" stroke-width="4" marker-end="url(#arrow)"/><path d="M593 445 L102 445" fill="none" stroke="#78313f" stroke-width="4" marker-end="url(#arrow)"/><circle cx="120" cy="245" r="11" fill="#78313f"/><circle cx="575" cy="245" r="11" fill="#78313f"/><circle cx="575" cy="445" r="11" fill="#78313f"/><circle cx="120" cy="445" r="11" fill="#78313f"/><text x="92" y="300" fill="#392d30" font-family="Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="92" dy="0">Roof drain</tspan></text><text x="547" y="300" fill="#392d30" font-family="Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="547" dy="0">Leader and cleanout</tspan></text><text x="547" y="500" fill="#392d30" font-family="Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="547" dy="0">Rear-court low point</tspan></text><text x="92" y="500" fill="#392d30" font-family="Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start"><tspan x="92" dy="0">Verified public</tspan><tspan x="92" dy="36.6">connection</tspan></text><path d="M48 594H912" stroke="#78313f" stroke-width="2"/><text x="48" y="624" fill="#78313f" font-family="Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="48" dy="0">CONCEPT DIAGRAM · LOCAL PROJECT DECISIONS</tspan></text></svg>